[package]
name = "ferrisfind-terminal"
version = "0.1.0"
edition = "2024"
description = "Local-first terminal browser for authorized local data"

[[bin]]
name = "ferrisfind"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
